name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://contactbook_app:ci-app-password@localhost:5432/postgres
      DATABASE_SSL: disable
      SETUP_TOKEN: ci-setup-token-0123456789abcdef
      APP_TIMEZONE: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser bundle must not contain secrets or server code
        run: npm run check:bundle
      - name: Create database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h localhost -U postgres -c "alter role contactbook_app login password 'ci-app-password'"
      - name: API security tests
        run: |
          npx next start -p 3100 &
          npx --yes wait-on@8.0.3 http://localhost:3100 --timeout 60000
          BASE=http://localhost:3100 node --test tests/e2e/security.test.mjs
